<!DOCTYPE html>
<html>

<head lang="Id">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Server Minecraft</title>
    <link rel="stylesheet" href="https://www.github.com/NexdyMC">
    <link rel="stylesheet" href="style/style.css">

</head>

<body>
    <main>
        <div class="container">

            <div class="header-text">
                <h1>Cek Server Bedrock</h1>
            </div>

            <div class="card-content">
                <a href="#" class="card-list">
                    <img src="images/bedrock.png" class="card-img" width="100">
                    <h3>Bedrock</h3>
                </a>
            </div>
            

            <!-- form -->
            <form class="form-content">
                <!-- input : ip  -->
                <label for="ip-input">IP Server </label>
                <input type="text" class="ip-input" id="ip-input" placeholder="Ex : play.example.com" required>
                
                <!-- input : port  -->
                <label for="ip-input">Port Server</label>
                <input type="text" class="ip-input" id="ip-input" placeholder="Ex : 19132" required>
                
                <!-- btn content -->
                <div class="btn-content">
                    <a href="index.html">Back</a>
                    <button type="button" data-bs-toggle="modal" data-bs-target="#ModalHasil">Cek</button>
                </div>
            </form>
        </div>
    </main> 

    <main>
        <div class="output-content" id="ModalHasil" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-body" id="server-status">
                        
                        <div class="d-flex justify-content-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                        <!-- Server info will be displayed here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- script js -->
    <script src="js/script.js"></script>
</body>
</html>
