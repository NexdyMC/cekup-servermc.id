<!DOCTYPE html>
<html>

<head lang="Id">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java | Cek Server MC</title>

  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    

  <link rel="stylesheet" href="https://www.github.com/NexdyMC">
  <link rel="stylesheet" href="style/style.css">

</head>

<body>
  <main>
    <!-- section : content -->
    <div class="container">
      <div class="header-text">
        <h1>Cek Server Minecraft</h1>
      </div>

      <div class="card-content">
        <a href="#" class="card-list">
          <img src="images/java.png" class="card-img" width="100">
          <h3>Java</h3>
        </a>
      </div>
      <form class="form-content">
        <div class="mb-3">
            <label for="ip-input" class="form-label">IP Server</label>
            <input type="text" class="form-control" id="ip-input" placeholder="Ex : play.example.com" required>
            <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#ModalHasil">Periksa</button>
        </div>
      </form>
    </div>

    <!-- section : credit -->
    <div class="credit-content">
      <div class="credit-box">
        <div class="credit-row">
          <span>Creators:</span>
          <span><strong>@NexdyMC</strong> & <strong>@AhzanMC</strong></span>
        </div>
        <div class="credit-row">
          <span>Version:</span>
          <span>1.21.30</span>
        </div>
        <div class="credit-row">
          <span>Open Source:</span>
          <span>
            <a href="https://github.com/AhzanMC" target="_blank" class="credit-link">GitHub AhzanMC</a>
            <a href="https://github.com/NexdyMC" target="_blank" class="credit-link">GitHub NexdyMC</a>
          </span>
        </div>
        <p class="thanks-text">Terima Kasih </p>
      </div>
    </div>

        <!-- Modal -->
    <div class="modal fade" id="ModalHasil" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-black" id="myModalLabel">Server Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="closeModal()"></button>
                </div>
                <div class="modal-body" id="server-status">
                    <div class="d-flex justify-content-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    <!-- Server info will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

  </main> 
  
    <!-- script js -->
  <script src="js/script.js"></script>
</body>

</html>
