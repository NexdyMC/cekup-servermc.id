<!DOCTYPE html>
<html>
<head lang="Id">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java | Cek Server MC</title>
  <!-- cdn : tailwind css -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.js"></script>
  <!-- link style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <main>

    <section class="border-2 min-w-72 w-full max-w-80 ">
      
      <!-- section : content -->
      <div class="text-center py-4 px-3">
        <p class="text-2xl">Server Java</p>
  
        <div class="mt-8 flex justify-center items-center gap-2">
          <a href="#" class="text-white bg-blue-600/10 grid content-between border-2 border-blue-600 p-4 rounded-xl duration-300 mt-4 hover:scale-105 hover:bg-blue-600/30">
            <img src="images/java.webp" class="card-img" width="100">
            <p class="mt-4">Java</p>
          </a>
        </div>
  
        <!-- form -->
        <form class="grid text-left">
            <label for="ip-input">IP Server</label>
            <input type="text" class="my-1 p-2 border-2 border-blue-600 bg-blue-600/20 text-white rounded-full" id="ip-input" placeholder="Ex : play.example.com" required>
  
            <div class="flex mt-4">
              <a href="index.html" class="duration-300 text-center w-full-">Back</a>
              <button type="button" data-bs-toggle="modal" data-bs-target="#ModalHasil">Cek</button>
            </div>
        </form>
      </div>
    </section> 
    
    <section>
      <!-- output -->
      <div class="output-content" id="ModalHasil" tabindex="-1" aria-labelledby="myModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                  <div class="modal-body" id="server-status">
                      <div class="d-flex justify-content-center">
                          <div class="spinner-border" role="status">
                              <span class="visually-hidden">Loading...</span>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </section>
    
  </main>
    <!-- script js -->
  <script src="js/script.js"></script>
</body>

</html>
